<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Shield fill gradient -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2" />
    </linearGradient>

    <!-- Shield glow -->
    <radialGradient id="shieldGlow" cx="50%" cy="30%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer glow effect -->
  <path
    d="M 50 5 L 85 22 L 85 50 Q 85 72 50 92 Q 15 72 15 50 L 15 22 Z"
    fill="url(#shieldGlow)"
    opacity="0.6"
  />

  <!-- Main shield shape -->
  <path
    d="M 50 5 L 85 22 L 85 50 Q 85 72 50 92 Q 15 72 15 50 L 15 22 Z"
    fill="url(#shieldFill)"
    stroke="#10B981"
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- Inner shield detail line -->
  <path
    d="M 50 12 L 78 26 L 78 50 Q 78 68 50 84 Q 22 68 22 50 L 22 26 Z"
    fill="none"
    stroke="#34D399"
    stroke-width="1.5"
    opacity="0.4"
    stroke-linejoin="round"
  />

  <!-- Highlight effect -->
  <path
    d="M 50 12 L 65 20 L 65 38 Q 65 45 50 50"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    opacity="0.2"
    stroke-linecap="round"
  />

  <!-- Three tier dots on the side -->
  <g transform="translate(88, 35)">
    <circle cx="0" cy="0" r="2.5" fill="#10B981" stroke="#ffffff" stroke-width="0.8" opacity="0.9" />
    <circle cx="0" cy="9" r="2.5" fill="#F59E0B" stroke="#ffffff" stroke-width="0.8" opacity="0.9" />
    <circle cx="0" cy="18" r="2.5" fill="#06B6D4" stroke="#ffffff" stroke-width="0.8" opacity="0.9" />
  </g>

  <!-- Mountain Icon (Earthquake) -->
  <g transform="translate(50, 38)">
    <!-- Glow -->
    <path d="M -8 10 L -4 -2 L 0 6 L 4 -4 L 8 10 Z" fill="#F59E0B" opacity="0.3" filter="blur(2px)"/>
    <!-- Main mountain -->
    <path d="M -8 10 L -4 -2 L 0 6 L 4 -4 L 8 10 Z" fill="#F59E0B" opacity="0.5" stroke="#F59E0B" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Divider line -->
  <line x1="35" y1="52" x2="65" y2="52" stroke="#10B981" stroke-width="0.5" opacity="0.3"/>

  <!-- Waves Icon (Tsunami) -->
  <g transform="translate(50, 64)">
    <!-- Glow -->
    <path d="M -12 0 Q -8 -3 -4 0 T 4 0 T 12 0" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.4" filter="blur(2px)"/>
    <!-- Main waves -->
    <path d="M -12 0 Q -8 -3 -4 0 T 4 0 T 12 0" fill="none" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -12 -3 Q -8 -6 -4 -3 T 4 -3 T 12 -3" fill="none" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
